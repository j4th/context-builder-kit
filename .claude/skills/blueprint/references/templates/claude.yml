# Claude Code GitHub Action — the interactive @claude mention handler. Blueprint
# template: copy to .github/workflows/claude.yml and fill the [bracketed] values.
# Ships beside claude-review.yml under the same scaffold PR/review answer.
#
# Fires when @claude is mentioned in a PR or issue comment, a review, or an issue body.
#   - concurrency + cancel-in-progress so a rapid back-and-forth does not queue
#   - skips bots and the `skip-claude` label (avoids @claude loops; the opt-out)
#   - explicit --allowedTools (least privilege at the tool level)
#   - the workhorse model at its default effort: mentions are interactive and quota-sensitive
#
# Needs the `CLAUDE_CODE_OAUTH_TOKEN` Actions secret (`/install-github-app`).
#
# SAFETY (constraint 2): no untrusted input (issue title, PR body, comment body) is
# interpolated into `run:` — ACTOR and the label JSON arrive through `env:` and are read
# as quoted shell variables. The action is pinned to a full commit SHA (constraint: the
# settle window, cbk-conventions-reference.md). A job timeout (constraint 3) and job-scoped
# permissions (constraint 6) as in claude-review.yml.

name: Claude (@claude mention)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude:
    name: Claude responds to @mention
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip if bot author or skip-claude label
        id: gate
        env:
          ACTOR: ${{ github.actor }}
          ISSUE_LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -uo pipefail
          ALL_LABELS="${ISSUE_LABELS_JSON:-[]} ${PR_LABELS_JSON:-[]}"
          if [[ "$ACTOR" == "claude[bot]" || "$ACTOR" == "dependabot[bot]" || "$ACTOR" == "renovate[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$ALL_LABELS" | grep -qF '"skip-claude"'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip == 'false'
        uses: actions/checkout@[full-commit-sha] # v[version]
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.gate.outputs.skip == 'false'
        uses: anthropics/claude-code-action@[full-commit-sha] # v[version]
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model [<workhorse model id>]
            --fallback-model [<mid-tier model id>]
            --max-turns 60
            --allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh run list:*),mcp__github_inline_comment__create_inline_comment"
